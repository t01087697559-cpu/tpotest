<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPO 코디 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2d2a3e; --sub:#6b6880; --pri:#7c6cf0; --pri-d:#5d4fd0; --pink:#f28bb3; --pink-d:#d76a95;
  --line:#ece8f6; --card:#ffffff; --ok:#2f9e6b; --tip:#e8913a; --radius:24px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Noto Sans KR',sans-serif;color:var(--ink);min-height:100vh;
  background:linear-gradient(135deg,#fdf0f7 0%,#f3efff 50%,#eaf3ff 100%);
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4,.jua{font-family:'Jua',sans-serif;font-weight:400}
button{font-family:inherit;cursor:pointer;color:inherit}
.app{max-width:1180px;margin:0 auto;padding:16px 16px 48px}

/* 상단 */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.brand{font-family:'Jua';font-size:24px;display:flex;align-items:center;gap:8px}
.brand .logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--pink),var(--pri));display:grid;place-items:center;font-size:20px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{font-size:13px;padding:7px 12px;border-radius:999px;background:#fff;color:var(--sub);border:1px solid var(--line);font-weight:500}
.steps button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.steps button.done{background:#ebe7ff;color:var(--pri);border-color:#ddd6ff}

/* 공통 */
.screen{display:none}
.screen.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 12px 32px rgba(124,108,240,.12);padding:22px;border:1px solid var(--line)}
.btn{border:none;border-radius:18px;padding:14px 24px;font-size:19px;font-family:'Jua';background:var(--pri);color:#fff;box-shadow:0 6px 0 var(--pri-d);transition:transform .08s,box-shadow .08s;min-height:54px}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--pri-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pink{background:var(--pink);box-shadow:0 6px 0 var(--pink-d)}
.btn.pink:active{box-shadow:0 3px 0 var(--pink-d)}
.btn.ghost{background:#fff;color:var(--pri);box-shadow:0 6px 0 #dcd6f7;border:2px solid #e4dffb}
.btn.big{font-size:24px;padding:18px 44px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}
.nav .right{display:flex;gap:12px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(280px,410px) 1fr;gap:18px;align-items:start}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.sticky{position:sticky;top:12px}
@media(max-width:820px){.sticky{position:static}}
.avatar-box{border-radius:20px;overflow:hidden;background:#f7f3ff}
.avatar-box svg{width:100%;height:auto;display:block;max-height:64vh}
@media(max-width:820px){.avatar-box svg{max-height:46vh;width:auto;margin:0 auto}}
.panel h3{margin:18px 0 8px;font-size:19px;display:flex;align-items:center;gap:8px}
.panel h3:first-child{margin-top:4px}
.panel h3 small{font-family:'Noto Sans KR';font-size:13px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 15px;font-size:16px;font-weight:500;min-height:48px;transition:.12s}
.chip:hover{border-color:#cfc6ff}
.chip.sel{border-color:var(--pri);background:#f1eeff;color:var(--pri);font-weight:700}
.chip:disabled{opacity:.4;cursor:not-allowed}
.swl{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--sub);width:54px;background:none;border:none;padding:0}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e0dcef;display:block}
.swl.sel .sw{box-shadow:0 0 0 3px var(--pri)}
.swl.sel{color:var(--pri);font-weight:700}
.pt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;font-size:13px}
.pt svg{width:40px;height:40px;border-radius:10px;display:block;border:1px solid #eee}
.note{background:#fff7fb;border:2px dashed #f6bfd5;border-radius:16px;padding:12px 16px;font-size:15px;margin:12px 0;line-height:1.6}
.note .chip{margin-top:8px;min-height:40px;padding:6px 12px;font-size:14px}
.noanswer{font-family:'Jua';font-size:20px;text-align:center;background:linear-gradient(90deg,#fff0f6,#f1eeff);border-radius:18px;padding:14px;margin:0 0 16px;color:#5a4fb8}

/* 시작 화면 */
.hero{display:grid;grid-template-columns:320px 1fr;gap:30px;align-items:center;padding:30px}
@media(max-width:760px){.hero{grid-template-columns:1fr;text-align:center;padding:22px}.hero-av{max-width:240px;margin:0 auto}}
.kicker{color:var(--pri);font-weight:700;margin:0 0 6px}
.hero h1{font-size:46px;margin:0 0 16px;background:linear-gradient(90deg,var(--pri),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.how{list-style:none;padding:0;margin:0 0 24px;display:grid;gap:10px;text-align:left}
.how li{display:flex;gap:12px;align-items:flex-start;background:#faf8ff;border-radius:16px;padding:12px 14px;font-size:17px;line-height:1.5}
.how b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-family:'Jua';font-weight:400}
.small{font-size:13px;color:var(--sub);margin-top:16px}

/* 미션 */
.mtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.mtop h2{margin:0;font-size:28px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.mgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.mgrid{grid-template-columns:1fr}}
.mcard{border:3px solid transparent;background:#fff;border-radius:22px;padding:18px;text-align:left;box-shadow:0 8px 20px rgba(80,60,140,.08);transition:.15s;position:relative}
.mcard .em{font-size:42px;line-height:1}
.mcard h4{font-size:22px;margin:10px 0 4px}
.mcard p{margin:0;color:var(--sub);font-size:14px;line-height:1.5}
.mcard.sel{border-color:var(--pri);transform:translateY(-4px);box-shadow:0 12px 26px rgba(124,108,240,.25)}
.mcard.sel::after{content:'✔ 선택';position:absolute;top:12px;right:12px;background:var(--pri);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px;font-weight:700}
.mcard.flash{border-color:var(--pink);background:#fff0f6;transform:scale(1.03)}
.mbar{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 16px;margin-bottom:14px;border:1px solid var(--line);flex-wrap:wrap}
.mbar .em{font-size:30px}
.mbar b{font-family:'Jua';font-size:21px;font-weight:400}
.mbar span.d{color:var(--sub);font-size:14px}

/* 코디 */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#f4f1ff;padding:6px;border-radius:18px;margin-bottom:6px}
.tab{border:none;background:transparent;border-radius:14px;padding:12px 4px;font-family:'Jua';font-size:19px;color:var(--sub)}
.tab.on{background:#fff;color:var(--pri);box-shadow:0 3px 10px rgba(124,108,240,.2)}
.bubble{margin-top:16px;background:#fff;border:2px solid #e2ddfb;border-radius:20px;padding:14px 16px;position:relative}
.bubble::before{content:'';position:absolute;top:-10px;left:48px;width:16px;height:16px;background:#fff;border-left:2px solid #e2ddfb;border-top:2px solid #e2ddfb;transform:rotate(45deg)}
.bt{font-family:'Jua';font-size:18px;color:var(--pri)}
.bnow{background:linear-gradient(90deg,#f6f3ff,#fff3f8);border-radius:14px;padding:10px 12px;margin:8px 0 10px;animation:pop .3s ease}
.bnow b{display:block;font-size:14px;color:var(--sub);font-weight:500}
.bnow p{margin:2px 0 0;font-size:16px;font-weight:700;line-height:1.5}
@keyframes pop{from{transform:scale(.95);opacity:.3}to{transform:none;opacity:1}}
.bsum{list-style:none;padding:0;margin:0;font-size:14px;line-height:1.5}
.bsum li{display:flex;gap:8px;padding:6px 0;border-top:1px dashed var(--line);align-items:flex-start}
.tag{flex:none;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;margin-top:1px}
.tg-모양{background:#efeefe;color:#5a4fb8}.tg-선{background:#e6f4ff;color:#2a6fb0}.tg-색{background:#ffe9f0;color:#c93d72}.tg-무늬{background:#fff3df;color:#b86a10}.tg-재질{background:#e7f7ee;color:#23804f}

/* 점검 */
.card h2{margin:0 0 10px;font-size:26px}
.stars{font-size:46px;letter-spacing:4px;line-height:1.1;margin:6px 0}
.stars span{display:inline-block;animation:starIn .4s ease both}
.stars .on{color:#ffc53d;text-shadow:0 3px 0 #f0a92a}
.stars .off{color:#e6e2f0}
@keyframes starIn{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.chkmsg{font-family:'Jua';font-size:20px;color:#5a4fb8;margin:6px 0 14px}
.rule{display:flex;gap:12px;padding:14px;border-radius:16px;margin:10px 0;background:#effaf4;border:1px solid #d3efdf}
.rule.tip{background:#fff6ec;border-color:#fbe0c2}
.rule .ic{font-size:26px;line-height:1}
.rule b{display:block;font-size:17px;margin-bottom:3px}
.rule p{margin:0;line-height:1.6;font-size:15px}
.who{display:inline-block;font-size:12px;background:#fff;border-radius:999px;padding:3px 10px;margin-top:6px;color:var(--sub);border:1px solid var(--line)}

/* 설명 */
.q{font-size:17px;font-weight:700;background:#f6f3ff;border-radius:14px;padding:12px 14px;line-height:1.6}
textarea{width:100%;border:2px solid var(--line);border-radius:18px;padding:14px;font-size:17px;font-family:inherit;line-height:1.7;resize:vertical;min-height:150px;outline:none}
textarea:focus{border-color:var(--pri)}
.words{margin:12px 0}
.words>span{display:block;font-size:14px;color:var(--sub);margin-bottom:6px}
.words .chip{min-height:38px;padding:5px 11px;font-size:14px}
.checklist{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.checklist li{display:flex;gap:10px;align-items:center;background:#faf9fd;border-radius:14px;padding:12px 14px;font-size:15px;border:1px solid var(--line)}
.checklist li.done{background:#effaf4;border-color:#cdeedb}
.checklist .ck{font-size:22px}
.checklist input{width:22px;height:22px;accent-color:var(--pri)}
.mini-sum{margin-top:14px;font-size:14px;line-height:1.7;background:#faf8ff;border-radius:16px;padding:12px 14px}
.mini-sum b{font-family:'Jua';font-weight:400;font-size:16px;color:var(--pri)}

/* 카드 */
.cc{max-width:760px;margin:0 auto;background:linear-gradient(160deg,#fff 0%,#fff 60%,#fdf2f8 100%)}
.cc-head{display:flex;justify-content:space-between;align-items:center;gap:12px;f
